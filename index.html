<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Sri Temple</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
:root{--bg:#fdf6ec;--fg:#3b2a1a;--c:#fff;--bd:#e3cfb0;--pr:#8a2b0f;--mu:#7a6650;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1510;--fg:#f3e6d3;--c:#2a1d14;--bd:#4a3626;--pr:#c4512b;--mu:#b9a58d;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1d1510;--fg:#f3e6d3;--c:#2a1d14;--bd:#4a3626;--pr:#c4512b;--mu:#b9a58d;color-scheme:dark}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.55 "Noto Sans Malayalam",system-ui,sans-serif}
a{color:var(--pr)}header{background:var(--pr);color:#fff;padding:10px 16px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
header b{font-size:19px}header a{color:#fff;text-decoration:none;margin-left:14px}main{max-width:960px;margin:auto;padding:16px;min-height:70vh}
.hero{text-align:center;padding:36px 12px;background:var(--c);border:1px solid var(--bd);border-radius:14px;margin-bottom:22px}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}.card{background:var(--c);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:14px}
.mu{color:var(--mu);font-size:13px}input,select{font:inherit;padding:8px;border:1px solid var(--bd);border-radius:6px;background:var(--c);color:var(--fg);max-width:100%}
.b{display:inline-block;background:var(--pr);color:#fff;border:0;padding:9px 16px;border-radius:8px;cursor:pointer;font:inherit;text-decoration:none}.b.g2{background:#777}
.r{display:grid;grid-template-columns:1.2fr 1fr 1.4fr auto auto;gap:6px;align-items:center;margin-bottom:8px}
@media(max-width:640px){.r{grid-template-columns:1fr 1fr}.r input,.r select{width:100%}}
.tot{font-size:22px;font-weight:700;text-align:right;margin:12px 0}.qr{width:220px;margin:12px auto}footer{text-align:center;padding:18px;color:var(--mu);font-size:13px}
.bd{background:#c62828;color:#fff;border-radius:10px;padding:1px 8px;font-size:12px}table{width:100%;border-collapse:collapse}td,th{border-bottom:1px solid var(--bd);padding:6px;text-align:left}
#pa{display:none}@media print{body>*:not(#pa){display:none!important}#pa{display:block;color:#000;font-size:13px;width:80mm}}@page{size:80mm auto;margin:3mm}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5}.logo{font-size:22px;display:flex;align-items:center;gap:8px}.logo i{font-style:normal;font-size:30px}
.ban{position:relative;height:280px;border-radius:14px;overflow:hidden;margin-bottom:22px}.sl{position:absolute;inset:0;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;opacity:0;animation:fd 15s infinite;padding:10px}.sl span{font-size:64px;animation:fl 3s ease-in-out infinite}.sl h2{margin:6px 0}
@keyframes fd{0%{opacity:0}5%,30%{opacity:1}38%,100%{opacity:0}}@keyframes fl{50%{transform:translateY(-8px)}}
.hs{display:grid;grid-template-columns:2fr 1fr;gap:16px;margin-bottom:22px;align-items:start}.hh{display:grid;grid-template-columns:1fr 1.2fr;gap:14px}.hh img,.gl img{width:100%;border-radius:10px;display:block}
.nw{height:200px;overflow:hidden}.nl{animation:up 14s linear infinite}.nw:hover .nl{animation-play-state:paused}.nl p{margin:0 0 12px}@keyframes up{to{transform:translateY(-50%)}}
.gl{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}@media(max-width:760px){.hs,.hh{grid-template-columns:1fr}}
</style></head><body>
<header><b class="logo"><i>🛕</i> ശ്രീ ക്ഷേത്രം · Sri Temple</b><nav><a href="#/">Home</a><a href="#/history">History</a><a href="#/vazhivad">Vazhivad</a><a href="#/news">News</a><a href="#/gallery">Gallery</a><a href="#/contact">Contact</a><a href="#/my" id="lg">Login</a></nav></header>
<main id="v"></main><footer>© Sri Temple</footer><div id="pa"></div>
<script>
const $=s=>document.querySelector(s),E=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const mem={},st={get(k,d){try{const v=localStorage.getItem('tw_'+k);return v?JSON.parse(v):d}catch(e){return k in mem?mem[k]:d}},set(k,v){mem[k]=v;try{localStorage.setItem('tw_'+k,JSON.stringify(v))}catch(e){}}};
let ITEMS=[{id:1,n:'പുഷ്പാഞ്ജലി (Pushpanjali)',p:20,c:'Normal'},{id:2,n:'അർച്ചന (Archana)',p:10,c:'Normal'},{id:3,n:'നെയ്‌വിളക്ക് (Neyvilakku)',p:30,c:'Normal'},{id:4,n:'ഗണപതിഹോമം (Ganapathi Homam)',p:50,c:'Daily Pooja'},{id:5,n:'ഭഗവതിസേവ (Bhagavathi Seva)',p:150,c:'Special Days'}];
let NAK=['അശ്വതി','ഭരണി','കാർത്തിക','രോഹിണി','മകയിരം','തിരുവാതിര','പുണർതം','പൂയം','ആയില്യം','മകം','പൂരം','ഉത്രം','അത്തം','ചിത്തിര','ചോതി','വിശാഖം','അനിഴം','തൃക്കേട്ട','മൂലം','പൂരാടം','ഉത്രാടം','തിരുവോണം','അവിട്ടം','ചതയം','പൂരുരുട്ടാതി','ഉത്രട്ടാതി','രേവതി'];
let NEWS=[{id:1,d:'2026-10-15',t:'Navaratri celebrations begin',s:'Nine days of special poojas and cultural programmes.',b:'Navaratri celebrations begin with special poojas every evening, followed by cultural programmes. Devotees are invited to take part. (Replace this text with your own news.)'},{id:2,d:'2026-10-10',t:'New darshan timings',s:'Revised morning and evening timings from this month.',b:'Morning darshan 5:00–11:30 and evening darshan 5:00–8:00. (Replace with real timings.)'},{id:3,d:'2026-10-02',t:'Annadanam on Vijayadashami',s:'Free meals for all devotees at noon.',b:'Annadanam will be served at noon on Vijayadashami. Volunteers may contact the temple office. (Replace with real details.)'}];
const FBCFG={apiKey:"AIzaSyCEPupDR2d6sXHcoBbBYtXYxHMjHH9khoY",authDomain:"templesw.firebaseapp.com",projectId:"templesw",storageBucket:"templesw.firebasestorage.app",messagingSenderId:"979053515730",appId:"1:979053515730:web:2f1f907468d595ebbc6e0b",measurementId:"G-ES34KTYBH0"};
firebase.initializeApp(FBCFG);const db=firebase.firestore(),auth=firebase.auth();
const REAL_OTP=false; // set to true after enabling Phone sign-in in Firebase Authentication (real SMS OTP)
let BK=[];const me=()=>auth.currentUser?st.get('me',''):'';
const SM={new:'Submitted',printed:'At counter',paid:'Paid'};
const loadBK=async()=>{try{const s=await db.collection('requests').where('uid','==',auth.currentUser.uid).get();BK=s.docs.map(d=>d.data()).sort((a,b)=>((b.createdAt&&b.createdAt.seconds)||0)-((a.createdAt&&a.createdAt.seconds)||0)).map(x=>({no:x.code,m:x.mobile,rows:x.entries.flatMap(e=>e.items.map(i=>({n:e.name,k:e.nak,i:i.name,p:i.price}))),tot:x.total,date:x.pdate+' ('+(x.createdStr||'')+')',s:SM[x.status]||x.status}))}catch(e){BK=[]}};
const go=h=>{location.hash='#/'+h};
const nCard=n=>`<div class=card><div class=mu>${n.d}</div><h3>${E(n.t)}</h3><p>${E(n.s)}</p><a href="#/news/${n.id}">More →</a></div>`;
const V={
'':()=>home(),old:()=>`<div class=hero><h1>ശ്രീ ക്ഷേത്രം · Sri Temple</h1><p>Book your vazhivad online and collect your receipt at the temple.</p><a class=b href="#/vazhivad">Book Vazhivad</a></div>
<h2>Latest News</h2><div class=g>${NEWS.map(nCard).join('')}</div><p><a href="#/news">All news →</a></p>
<div class=g><div class=card><h3>History</h3><p>A short story of our temple and its traditions.</p><a href="#/history">More →</a></div>
<div class=card><h3>Vazhivad</h3><p>Choose offerings for each family member and see the total instantly.</p><a href="#/vazhivad">More →</a></div>
<div class=card><h3>Contact us</h3><p>Address, phone and temple office timings.</p><a href="#/contact">More →</a></div></div>`,
news:()=>`<h2>News</h2><div class=g>${NEWS.map(nCard).join('')}</div>`,
history:()=>`<h2>History</h2><div class=card><div class=hh><img src="${sv('#8a2b0f','#e08a1e','🛕')}" alt="Temple"><div><p>${HIST}</p><p class=mu>(Placeholder text — send me the real history and photos.)</p></div></div></div><h2>Special Poojas &amp; Utsavs</h2><div class=g>${SP.map(s=>`<div class=card><h3>${s[0]} ${s[1]}</h3><p>${s[2]}</p></div>`).join('')}</div>`,gallery:()=>`<h2>Gallery</h2>${gal()}`,
contact:()=>`<h2>Contact us</h2><div class=card><p>📍 Temple address, Kerala</p><p>📞 +91 00000 00000</p><p>✉️ temple@example.com</p><p>🕔 Office: 9:00 – 17:00</p></div>`,
login:()=>`<h2>Login</h2><div class=card><p>Enter your mobile number to continue.</p><input id=mb inputmode=numeric maxlength=10 placeholder="10-digit mobile"> <button class=b onclick=otp()>Send OTP</button><div id=o style="margin-top:12px"></div><div id=rc></div></div>`,
my:()=>{if(!me())return V.login();const l=BK;return `<h2>My receipts</h2><p>+91 ${me()} · <a href="#" onclick="st.set('me','');nav();return false">Logout</a></p><p><a class=b href="#/vazhivad">New booking</a></p><div class=card>${l.map(b=>`<p><a href="#/receipt/${b.no}">${b.no}</a> · ₹${b.tot} · ${b.date} · ${b.s}</p>`).join('')||'No bookings yet.'}</div>`},
vazhivad:()=>{if(!me())return V.login();return `<h2>Vazhivad Booking</h2><div class=card><p class=mu>Add one row per person, choose nakshatram and vazhivad.</p><div id=rows></div><button class="b g2" onclick=addR()>+ Add person</button><div class=tot>Total: ₹<span id=tt>0</span></div><button class=b onclick=sub()>Submit booking</button></div>`},
receipt:n=>{const b=BK.find(x=>x.no===n);if(!b)return '<p>Receipt not found.</p>';return `<h2>Receipt ${b.no}</h2><div class="card" style="text-align:center"><div class=qr id=qr></div><p><b>Show this QR at the temple counter scanner.</b><br><span class=mu>Status: ${b.s}</span></p></div><div class=card>${tbl(b)}</div>`}};
const sv=(a,b,e)=>'data:image/svg+xml,'+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${a}"/><stop offset="1" stop-color="${b}"/></linearGradient></defs><rect width="400" height="300" fill="url(#g)"/><text x="200" y="185" font-size="110" text-anchor="middle">${e}</text></svg>`);
const HIST='The temple has been a centre of prayer and community for generations. Devotees from nearby villages gather here for daily poojas, festivals and family rituals. Write the story of the deity, the founding of the temple and its traditions here.';
const SP=[['🪔','Daily Pooja','Performed every morning and evening. It keeps the temple lively with prayer and brings peace to the whole community.'],['🔥','Ganapathi Homam','A fire ritual to Lord Ganapathi to remove obstacles. Devotees offer it before a new beginning such as a house, job or journey.'],['🌸','Bhagavathi Seva','A special offering to the Goddess for protection, health and family wellbeing, usually done on auspicious days.'],['🎪','Annual Utsavam','The main temple festival with processions, music and community meals. It brings families together every year.'],['🌙','Navaratri','Nine nights of worship of the Goddess, ending with Vijayadashami, when children begin their first letters.'],['🌾','Vishu &amp; Thiruvathira','Festivals of new beginnings and prosperity, celebrated with special poojas and the first auspicious sight of the year.']];
const GAL=[['#8a2b0f','#e08a1e','🛕'],['#c06014','#f2c14e','🪔'],['#6a1b4d','#c2185b','🌸'],['#1b5e20','#9ccc65','🌿'],['#283593','#7986cb','🎆'],['#e65100','#ffb74d','🐘']];
const gal=()=>`<div class=gl>${GAL.map((g,i)=>`<img src="${sv(...g)}" alt="Gallery ${i+1}">`).join('')}</div>`;
const home=()=>`<section class=ban>${[['🛕','Welcome to Sri Temple','Peace, devotion and blessings','#8a2b0f,#e08a1e'],['🪔','Daily Poojas &amp; Special Utsavs','Join us in prayer','#6a1b4d,#e65100'],['🙏','Book Vazhivad Online','Collect your receipt at the temple counter','#1b5e20,#c06014']].map((s,i)=>`<div class=sl style="animation-delay:${i*5}s;background:linear-gradient(135deg,${s[3]})"><span>${s[0]}</span><h2>${s[1]}</h2><p>${s[2]}</p></div>`).join('')}</section>
<div class=hs><div class=card><h2>History of the Temple</h2><div class=hh><img src="${sv('#8a2b0f','#e08a1e','🛕')}" alt="Temple"><div><p>${HIST}</p><a href="#/history">More →</a></div></div></div>
<aside><div class=card><h3>🙏 Donations</h3><p class=mu>Placeholder details:</p><p>A/c Name: Sri Temple Trust<br>A/c No: 0000000000<br>IFSC: XXXX0000000<br>UPI: temple@upi</p></div>
<div class=card><h3>📰 News</h3><div class=nw><div class=nl>${[0,1].map(()=>NEWS.map(n=>`<p><span class=mu>${n.d}</span><br><a href="#/news/${n.id}">${E(n.t)}</a></p>`).join('')).join('')}</div></div></div></aside></div>
<h2>Special Poojas &amp; Utsavs</h2><div class=g>${SP.map(s=>`<div class=card><h3>${s[0]} ${s[1]}</h3><p>${s[2]}</p><a href="#/history">More →</a></div>`).join('')}</div>
<h2>Gallery</h2>${gal()}
<h2 style="margin-top:22px">Contact us</h2><div class=card><p>📍 Temple address, Kerala</p><p>📞 +91 00000 00000</p><p><a href="https://facebook.com" target="_blank" rel="noopener">Facebook</a> · <a href="https://instagram.com" target="_blank" rel="noopener">Instagram</a> · <a href="https://youtube.com" target="_blank" rel="noopener">YouTube</a> · <a href="https://wa.me/910000000000" target="_blank" rel="noopener">WhatsApp</a></p></div>`;
const tbl=b=>`<table><tr><th>Name</th><th>Nakshatram</th><th>Vazhivad</th><th>₹</th></tr>${b.rows.map(r=>`<tr><td>${E(r.n)}</td><td>${E(r.k)}</td><td>${E(r.i)}</td><td>${r.p}</td></tr>`).join('')}</table><div class=tot>Total ₹${b.tot}</div>`;
async function otp(){const m=$('#mb').value.trim();if(!/^[6-9]\d{9}$/.test(m))return $('#o').textContent='Enter a valid 10-digit mobile number.';window.MB=m;
if(REAL_OTP){try{window.RV=window.RV||new firebase.auth.RecaptchaVerifier('rc',{size:'invisible'});window.CR=await auth.signInWithPhoneNumber('+91'+m,window.RV);$('#o').innerHTML='<p class=mu>OTP sent by SMS to +91 '+m+'.</p><input id=ot inputmode=numeric maxlength=6 placeholder="OTP"> <button class=b onclick=ver()>Verify</button>'}catch(e){$('#o').textContent=e.message}return}
window.OTP=String(1000+Math.floor(Math.random()*9000));$('#o').innerHTML=`<p class=mu>DEMO MODE — your OTP is <b>${OTP}</b> (a live site would send this by SMS).</p><input id=ot inputmode=numeric maxlength=4 placeholder="OTP"> <button class=b onclick=ver()>Verify</button>`}
async function ver(){try{if(REAL_OTP)await window.CR.confirm($('#ot').value);else{if($('#ot').value!==window.OTP)return alert('Wrong OTP');if(!auth.currentUser)await auth.signInAnonymously()}st.set('me',window.MB);await loadBK();location.hash==='#/vazhivad'?nav():go('vazhivad')}catch(e){alert('Login failed: '+e.message)}}
const opt=()=>['Normal','Daily Pooja','Special Days'].map(c=>`<optgroup label="${c}">${ITEMS.filter(i=>i.c===c).map(i=>`<option value=${i.id} data-p=${i.p}>${E(i.n)} – ₹${i.p}</option>`).join('')}</optgroup>`).join('');
function addR(){const d=document.createElement('div');d.className='r';d.innerHTML=`<input class=nm placeholder="Name"><select class=nk><option value="">Nakshatram</option>${NAK.map(n=>`<option>${n}</option>`).join('')}</select><select class=it onchange=sum()><option value="">Vazhivad</option>${opt()}</select><b class=pr>₹0</b><button class="b g2" onclick="this.parentNode.remove();sum()">×</button>`;$('#rows').appendChild(d);sum()}
function sum(){let t=0;document.querySelectorAll('#rows .r').forEach(r=>{const p=+(r.querySelector('.it').selectedOptions[0].dataset.p||0);r.querySelector('.pr').textContent='₹'+p;t+=p});$('#tt').textContent=t}
async function sub(){const es=[];for(const r of document.querySelectorAll('#rows .r')){const n=r.querySelector('.nm').value.trim(),k=r.querySelector('.nk').value,o=r.querySelector('.it').selectedOptions[0];if(!n||!k||!o.value)return alert('Fill name, nakshatram and vazhivad in every row');const it=ITEMS.find(x=>String(x.id)===o.value);es.push({name:n,nak:k,items:[{id:String(it.id),name:it.n,price:+it.p}]})}
if(!es.length)return alert('Add at least one person');
try{if(!auth.currentUser){if(REAL_OTP){st.set('me','');return go('my')}await auth.signInAnonymously()}
const A='ABCDEFGHJKLMNPQRSTUVWXYZ23456789',tot=es.reduce((a,e)=>a+e.items[0].price,0);let code;
for(let t=0;t<3;t++){code='T'+Array.from(crypto.getRandomValues(new Uint8Array(6)),x=>A[x%32]).join('');try{await db.collection('requests').doc(code).set({code,uid:auth.currentUser.uid,mobile:st.get('me',''),pdate:new Date().toLocaleDateString('en-CA'),entries:es,total:tot,status:'new',counter:null,billNo:null,createdAt:firebase.firestore.FieldValue.serverTimestamp(),createdStr:new Date().toLocaleString('en-IN',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'})});break}catch(e){if(t==2)throw e}}
await loadBK();go('receipt/'+code)}catch(e){alert('Could not submit: '+e.message)}}
async function nav(){const h=location.hash.replace(/^#\//,''),[p,a]=h.split('/');$('#lg').textContent=me()?'My receipts':'Login';if((p==='my'||p==='receipt')&&me())await loadBK();
$('#v').innerHTML=p==='news'&&a?(n=>n?`<div class=card><div class=mu>${n.d}</div><h2>${E(n.t)}</h2><p>${E(n.b)}</p><a href="#/news">← Back</a></div>`:'')(NEWS.find(x=>x.id==a)):(V[p]||V[''])(a);
if(p==='vazhivad'&&me())addR();
if(p==='receipt'&&$('#qr')){try{const q=qrcode(0,'M');q.addData(a);q.make();$('#qr').innerHTML=q.createSvgTag({scalable:true})}catch(e){$('#qr').innerHTML='<h2>'+E(a)+'</h2>'}}scrollTo(0,0)}
addEventListener('hashchange',nav);
(async()=>{try{const s=await db.collection('config').doc('shop').get();if(s.exists){const d=s.data(),cm={normal:'Normal',daily:'Daily Pooja',special:'Special Days'};if(d.nak&&d.nak.length)NAK=d.nak;if(d.items&&d.items.length)ITEMS=d.items.map(i=>({id:i.id,n:i.name,p:i.price,c:cm[i.cat]||'Normal'}))}}catch(e){}
await new Promise(r=>{const u=auth.onAuthStateChanged(()=>{u();r()})});if(me())await loadBK();nav()})();
</script></body></html>
